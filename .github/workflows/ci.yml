name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    # Forked PRs cannot access repository secrets.
    # Run the Docker build for pushes and same-repository PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install "dvc>=3,<4" --no-cache-dir

      - name: Configure DagsHub credentials
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$DAGSHUB_USER" ] || [ -z "$DAGSHUB_TOKEN" ]; then
            echo "::error::Configure DAGSHUB_USER and DAGSHUB_TOKEN in GitHub Actions secrets."
            exit 1
          fi

          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "$DAGSHUB_USER"
          dvc remote modify --local dagshub password "$DAGSHUB_TOKEN"

      - name: Pull DVC-tracked data and model
        run: dvc pull -r dagshub

      - name: Build Docker image
        run: docker build -t delivery-eta-mlops:ci .